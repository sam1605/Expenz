<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-beta.1/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-beta.1/js/select2.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="sidebar">
        <ul>
            <li><i class="fas fa-home"></i><span>Dashboard</span></li>
            <li><i class="fas fa-file-invoice-dollar"></i><span>Bills & Payments</span></li>
            <li><i class="fas fa-chart-line"></i><span>Expenses</span> <span
                    style="color: red; font-size: 12px; margin-left: 5px;">New</span></li>
            <li><i class="fas fa-cog"></i><span>Settings</span></li>
            <li><i class="fas fa-question-circle"></i><span>Get Help</span></li>
        </ul>
    </div>

    <div class="main">
        <div class="shopping-section">
            <h3>Accounts</h3>
            <div class="owl-carousel">
                <div class="item">
                    <span>Electronics</span>
                </div>
            </div>
        </div>
        <div class="chart">
            <h3>Spending Overview</h3>
            <canvas id="spendingChart" style="width: 100%; height: 300px;"></canvas>
        </div>

        <div class="transaction-history">
            <h3>Your Transaction History</h3>
            <div class="transaction-item">
                <span>Burger King</span>
                <span>₹3,197</span>
            </div>
            <div class="transaction-item">
                <span>Arun Payment</span>
                <span style="color: green;">₹20,000</span>
            </div>
            <div class="transaction-item">
                <span>PVR Forum</span>
                <span>₹2,187</span>
            </div>
            <div class="transaction-item">
                <span>McDonald's, HSR</span>
                <span>₹3,103</span>
            </div>
        </div>

        <div class="shopping-section">
            <h3>Shopping Filter</h3>
            <select class="shopping-dropdown" multiple="multiple">
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="groceries">Groceries</option>
                <option value="accessories">Accessories</option>
            </select>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        $(document).ready(function () {
            // Initialize Select2 Dropdown
            $('.shopping-dropdown').select2({
                placeholder: 'Select categories',
                allowClear: true
            });

            // Initialize Chart.js
            const ctx = document.getElementById('spendingChart').getContext('2d');
            const spendingChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Nov 08', 'Nov 12', 'Nov 16', 'Nov 20', 'Nov 24', 'Nov 28', 'Dec 02', 'Dec 06'],
                    datasets: [
                        {
                            label: 'Food & Drinks',
                            data: [5000, 7000, 6000, 8000, 10000, 7500, 8500, 9500],
                            borderColor: '#ff6384',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            fill: true
                        },
                        {
                            label: 'Shopping',
                            data: [3000, 4000, 5000, 7000, 8000, 6000, 7000, 6500],
                            borderColor: '#36a2eb',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    }
                }
            });

            // Initialize Owl Carousel
            $('.owl-carousel').owlCarousel({
        loop: false,
        margin: 10,
        nav: true,
        navText: ['Previous', 'Next'],
        responsive: {
            0: {
                items: 1
            },
            600: {
                items: 2
            },
            1000: {
                items: 3
            }
        }
    });

        });
    </script>
</body>

</html>
